name: firmware

on:
  push:
    branches: [main]
    tags: ["fw-v*"]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio esptool

      - name: Build
        run: pio run -d firmware

      - name: Merge into one image for 0x0
        run: |
          b=firmware/.pio/build/esp32s3
          boot_app0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          mkdir dist
          esptool.py --chip esp32s3 merge_bin -o dist/vnl-bridge.bin --flash_mode keep --flash_size keep \
            0x0 $b/bootloader.bin 0x8000 $b/partitions.bin 0xe000 "$boot_app0" 0x10000 $b/firmware.bin
          size=$(stat -c %s $b/firmware.bin)
          printf 'commit %s\nrun %s\napp_bytes %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$size" > dist/build-info.txt
          cat dist/build-info.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vnl-bridge
          path: dist/

      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=fw-build-$GITHUB_RUN_NUMBER; fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --notes "Firmware from $GITHUB_SHA"
