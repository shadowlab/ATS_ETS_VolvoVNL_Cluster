; Step 3 firmware for the ESP32-S3. Stage 1 is the J1708 <-> USB bridge.
; CI builds this; see firmware/README.md for flashing.

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; DIO and a 4 MB layout boot on any ESP32-S3 module, whatever its flash size.
board_build.flash_mode = dio
board_build.partitions = default.csv
board_upload.flash_size = 4MB
; Serial is the chip's native USB port (USB Serial/JTAG), not the UART bridge.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
